<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Utilidade Pública</title>
    <script src="script.js" defer></script>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="space"></div>
    <div class="container">
        <div class="header">
            <h1>Central de Emergência</h1>
        </div>
        <div class="content">
            <select id="emergency-select">
                <option value="null" selected disabled>Selecione um serviço</option>
                <option value="bomb">Bombeiros</option>
                <option value="pm">Polícia Militar</option>
                <option value="samu">SAMU</option>
                <option value="civil">Polícia Civil</option>
                <option value="dfcivil">Defesa Civil</option>
                <option value="prf">Polícia Rodoviária Federal</option>
                <option value="deat">Delegacia do Turismo</option>
                <option value="denuncia">Disque Denúncia</option>
                <option value="mulher">Central de Atendimento a Mulher</option>
                <option value="dh">Direitos Humanos</option>
                <option value="procon">Procon</option>
                <option value="hemorio">Hemorio</option>
                <option value="detran">Detran</option>
                <option value="ambiente">Disque Ambiente</option>
            </select>
        </div>
        <div id="boton">
            <button id="informar" onclick="informar()">Informar Número</button>
        </div>
    </div>
</body>

</html>
